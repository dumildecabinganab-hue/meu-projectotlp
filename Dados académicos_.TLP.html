<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <title>Formulário de Dados Académicos</title>
</head>
<body>
  <h2>Formulário de Dados Académicos</h2>

  <form action="processar_dados.php" method="post">
    <!-- Nome completo -->
    <label for="nome">Nome completo:</label><br>
    <input type="text" id="nome" name="nome" required><br><br>

    <!-- Número do estudante -->
    <label for="numero">Número de estudante:</label><br>
    <input type="text" id="numero" name="numero" required><br><br>

    <!-- Curso -->
    <label for="curso">Curso:</label><br>
    <input type="text" id="curso" name="curso"><br><br>

    <!-- Ano académico -->
    <label for="ano">Ano académico:</label><br>
    <select id="ano" name="ano">
      <option value="">--Selecione o ano--</option>
      <option value="1">1º Ano</option>
      <option value="2">2º Ano</option>
      <option value="3">3º Ano</option>
      <option value="4">4º Ano</option>
    </select><br><br>

    <!-- Turno -->
    <label>Turno:</label><br>
    <input type="radio" id="manha" name="turno" value="Manhã">
    <label for="manha">Manhã</label><br>
    <input type="radio" id="tarde" name="turno" value="Tarde">
    <label for="tarde">Tarde</label><br>
    <input type="radio" id="noite" name="turno" value="Noite">
    <label for="noite">Noite</label><br><br>

    <!-- Disciplinas preferidas -->
    <label>DiscOrganização de imprensa iplinas preferidas:</label><br>
    <input type="checkbox" id="matematica" name="disciplinas" value="Matemática">
    <label for="matematica">Matemática</label><br>
    <input type="checkbox" id="IAG" name="disciplinas" value="Física">
    <label for="IAG">IAG</label><br>
    <input type="checkbox" id="TLP" name="disciplinas" value="Química">
    <label for="T.L.P">T.L.P</label><br><br>

    <!-- Observações -->
    <label for="obs">Observações:</label><br>
    <textarea id="obs" name="observacoes" rows="4" cols="40"></textarea><br><br>


    <input type="submit" value="Enviar">
    <input type="reset" value="Limpar">
  </form>
</body>
</html>
